<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0C3338">
  <title>Prumo — sem conexão</title>
  <style>
    :root { color-scheme: light dark; --bg:#EEF2F1; --text:#0F2224; --muted:#51676A; --ink:#0C3338; }
    @media (prefers-color-scheme: dark) { :root { --bg:#071416; --text:#E8F1F0; --muted:#94ADAE; --ink:#F2A0B5; } }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--text);
           font:16px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; text-align:center; padding:24px; }
    img { width:72px; height:72px; border-radius:18px; }
    h1 { font-size:20px; margin:16px 0 4px; }
    p { color:var(--muted); margin:0 0 20px; }
    button { min-height:48px; padding:0 22px; border-radius:999px; border:0; background:var(--ink); color:var(--bg); font:inherit; font-weight:600; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Sem conexão</h1>
    <p>Por segurança, o Prumo não guarda seus saldos no aparelho.<br>Conecte-se à internet para ver seus dados.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
